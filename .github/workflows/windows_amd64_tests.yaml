name: "Tests(windows/amd64)"

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Test with AutoInstall ONNX Runtime (CPU)
        env:
          GOMLX_BACKEND: onnx:cpu
        run: |
          go test . -v -count=1

      - name: Test Native (CPU)
        env:
          GOMLX_BACKEND: onnx:cpu
        run: |
          go test ./...
